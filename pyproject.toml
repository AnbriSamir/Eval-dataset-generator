[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-dataset-generator"
version = "0.1.0"
description = "Turn raw production logs into a labeled, deduplicated, statistically validated evaluation dataset — agreement measured (Cohen's kappa + CI95), never declared."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samir Anbri" }]
keywords = [
  "evaluation", "dataset", "llm", "data-mining", "clustering", "auto-labeling",
  "cohens-kappa", "dedup", "provenance", "llm-judge",
]

# NOTE: lower bounds here; exact versions are locked at `make install` time
# (the meta.json provenance discipline pins what a published number was measured with).
dependencies = [
  # Contracts / settings
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # LLM judge (official SDK only — see CLAUDE.md binding rules). Floor = the version
  # the judge was built and verified against: the load-bearing
  # `messages.parse(output_format=...) -> .parsed_output` surface needs a modern SDK.
  "anthropic>=0.116",
  # Mining: clustering (sklearn >= 1.3 ships HDBSCAN) + stats (kappa, bootstrap CI95)
  "scikit-learn>=1.3",
  "numpy>=1.26",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/anbsamsam17/eval-dataset-generator"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgen"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear, simplify

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true   # sklearn/scipy ship incomplete stubs

[tool.pytest.ini_options]
pythonpath = ["src"]   # import `evalgen` in tests without an editable install
testpaths = ["tests"]
addopts = "-q"
# A sklearn/scipy deprecation must fail the suite loudly (the mining layer must not
# silently ride a deprecated API into a breaking minor bump). Kept narrow so
# unrelated third-party deprecations don't break the build.
filterwarnings = [
  "error::DeprecationWarning:sklearn",
  "error::DeprecationWarning:scipy",
]
